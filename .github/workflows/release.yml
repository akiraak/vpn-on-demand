# Builds the Windows installer and attaches it to a draft release.
# Runs when a version tag (v0.1.0) is pushed. The draft is published by hand after checking it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but tauri.conf.json says $version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install the front-end dependencies
        working-directory: app
        run: npm ci

      - name: Unit tests
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Build the installer and create the draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: VPN on Demand v__VERSION__
          releaseBody: |
            Windows 10 / 11 (64-bit). Download the `-setup.exe` below and follow the
            [README](https://github.com/akiraak/vpn-on-demand#setup).

            The installer is not code-signed. When Windows shows "Windows protected your PC",
            click **More info**, then **Run anyway**.
          releaseDraft: true
          prerelease: false
