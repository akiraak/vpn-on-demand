<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VPN on Demand（試作）</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <nav class="tabs">
      <button data-tab="status" class="active">状態</button>
      <button data-tab="regions">国とリージョン</button>
      <button data-tab="settings">設定</button>
    </nav>

    <section id="tab-status" class="tab">
      <div class="row">
        <h2>Tailscale の状態</h2>
        <button id="status-refresh">読み直す</button>
      </div>
      <div id="status-body" class="body">読み込み中…</div>
    </section>

    <section id="tab-regions" class="tab" hidden>
      <div class="row">
        <h2>Vultr の国とリージョン</h2>
        <button id="regions-refresh">読み直す</button>
      </div>
      <div class="row">
        <label>国 <select id="country"></select></label>
        <label>都市 <select id="city"></select></label>
      </div>
      <p id="regions-note" class="note"></p>
    </section>

    <section id="tab-settings" class="tab" hidden>
      <h2>キー（ダミーで試す）</h2>
      <p class="note">
        OS の資格情報ストア（Windows の資格情報マネージャー、macOS のキーチェーン）に、サービス名
        <code>vpn-on-demand-poc</code> で保存します。本物のキーは入れないでください。
      </p>
      <form id="secret-form" class="row">
        <select id="secret-name">
          <option value="vultr_api_key">Vultr の API キー</option>
          <option value="tailscale_auth_key">Tailscale の auth key</option>
        </select>
        <input id="secret-value" type="password" placeholder="ダミーの値" autocomplete="off" />
        <button type="submit">保存</button>
        <button type="button" id="secret-delete">消す</button>
      </form>
      <table id="secret-table"></table>
      <p id="secret-msg" class="note"></p>
    </section>
  </body>
</html>
